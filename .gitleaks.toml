[extend]
useDefault = true

# The launcher contract tests plant fake credentials and then assert those
# VALUES never reach a container argv, a log, or a command line. Proving that
# requires literals that look like credentials, so the scanner finds them —
# they are the test's subject, not a leak.
#
# Allowlisted by VALUE, never by path. A path allowlist would switch scanning
# off for the whole file, so a real credential pasted into a test later would
# ship unnoticed; these entries only excuse the exact synthetic strings below,
# every one of which the tests assert the ABSENCE of.
[allowlist]
description = "Synthetic credentials asserted absent by the launcher contract tests"
regexes = [
  '''^secret-anthropic-key-777$''',
  '''^secret-gh-token-abcxyz$''',
  '''^secret-openrouter-key-555$''',
  '''^secret-registration-token-999$''',
  '''^apptainer-secret-(gh|openai|reg)-token$''',
]
