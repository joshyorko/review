# Local-only model routing for the executable OMP probe. The probe server
# accepts no network connections outside 127.0.0.1.
modelRoles:
  default: local-probe/deterministic
  task: local-probe/deterministic
  smol: local-probe/deterministic
  tiny: local-probe/deterministic
  advisor: local-probe/deterministic
advisor:
  enabled: false
async:
  enabled: false
task:
  agentModelOverrides:
    task: local-probe/deterministic

# Keep startup and child-session catalog discovery off every built-in provider.
# The only usable model in this run is the configured local-probe provider.
