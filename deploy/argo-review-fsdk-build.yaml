apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: review-fsdk-build-
  namespace: argo
  labels:
    app.kubernetes.io/component: review-build
    app.kubernetes.io/part-of: bluefin-test-suite
    workflows.argoproj.io/creator: system-admin
spec:
  entrypoint: build-review-container
  serviceAccountName: argo
  activeDeadlineSeconds: 3600
  arguments:
    parameters:
    - name: repo
      value: https://github.com/projectbluefin/review.git
    - name: ref
      value: omp-port
    - name: registry
      value: 192.168.1.102:30500
    - name: image-name
      value: review
    - name: image-tag
      value: omp-testing
  templates:
  - name: build-review-container
    inputs:
      parameters:
      - name: repo
      - name: ref
      - name: registry
      - name: image-name
      - name: image-tag
    script:
      image: 192.168.1.102:30500/bst2:64eb0b4930d57a92710822898fb73af6cc1ae35d
      command: [bash]
      securityContext:
        privileged: true
        seLinuxOptions:
          type: spc_t
      env:
      - name: REPO
        value: "{{inputs.parameters.repo}}"
      - name: REF
        value: "{{inputs.parameters.ref}}"
      - name: REGISTRY
        value: "{{inputs.parameters.registry}}"
      - name: IMAGE_NAME
        value: "{{inputs.parameters.image-name}}"
      - name: IMAGE_TAG
        value: "{{inputs.parameters.image-tag}}"
      - name: BUILDBOX_STAGER
        value: copy-or-link
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
        limits:
          cpu: "4"
          memory: 8Gi
      source: |
        set -euo pipefail
        echo "=== Cloning ${REPO} at ${REF} ==="
        rm -rf /work/src
        mkdir -p /work
        git clone --depth=1 --branch "${REF}" "${REPO}" /work/src
        cd /work/src

        echo "=== Building review appliance container ==="
        podman build \
          --format oci \
          -f image/Containerfile \
          -t "${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}" \
          .

        echo "=== Pushing image to local registry ==="
        podman push \
          --tls-verify=false \
          "${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"

        echo "=== Verification ==="
        skopeo inspect --tls-verify=false "docker://${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}" | jq '{Digest: .Digest, RepoTags: .RepoTags, Created: .Created}'
      volumeMounts:
      - name: workdir
        mountPath: /work
      - name: fuse
        mountPath: /dev/fuse
    volumes:
    - name: workdir
      emptyDir: {}
    - name: fuse
      hostPath:
        path: /dev/fuse
