# Replace the placeholder before applying. Keep the real contributor token out
# of source control.
apiVersion: v1
kind: Secret
metadata:
  name: review-contributor-secret
  namespace: bluefin-system
  labels:
    app.kubernetes.io/name: review-contributor
    app.kubernetes.io/component: contributor
    app.kubernetes.io/part-of: review
type: Opaque
stringData:
  contributor.env: |
    HIVE_CONTRIBUTOR_TOKEN=replace-with-real-token
