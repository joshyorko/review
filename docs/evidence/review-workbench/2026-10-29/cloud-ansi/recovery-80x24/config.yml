startup:
  checkUpdate: false
  setupWizard: false
modelRoles:
  advisor: local-probe/deterministic
  default: local-probe/deterministic
  task: local-probe/deterministic
  smol: local-probe/deterministic
  tiny: local-probe/deterministic
advisor:
  syncBacklog: 1
  enabled: false
eval:
  workpool:
    freshAgents: true
task:
  maxConcurrency: 4
  maxRecursionDepth: 1
  maxRuntimeMs: 3600000
  softRequestBudget: 90
  agentIdleTtlMs: 300000
  isolation:
    enabled: true
    apply: false
  agentModelOverrides:
    task: local-probe/deterministic
isolation:
  backend: auto
read:
  defaultLimit: 200
tools:
