name: Request Review release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: 'Optional exact version override (MAJOR.MINOR.PATCH)'
        required: false
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: review-release-request
  cancel-in-progress: false

jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - name: Check release request target
        env:
          REQUEST_REPOSITORY: ${{ github.repository }}
          REQUEST_REF: ${{ github.ref }}
        run: |
          if [ "$REQUEST_REPOSITORY" != joshyorko/review ] || [ "$REQUEST_REF" != refs/heads/main ]; then
            echo "::error::Run this workflow on main in joshyorko/review."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - name: Load pinned Dagger release planner
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: '0.21.11'
          verb: functions
          module: .dagger/release-request
      - name: Plan and request release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          REQUESTED_BUMP: ${{ inputs.bump }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: bin/ci --profile release-plan --apply
