name: Request Review release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: 'Optional exact version override (MAJOR.MINOR.PATCH)'
        required: false
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: review-release-request
  cancel-in-progress: false

jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - name: Check release request target
        env:
          REQUEST_REPOSITORY: ${{ github.repository }}
          REQUEST_REF: ${{ github.ref }}
        run: |
          if [ "$REQUEST_REPOSITORY" != joshyorko/review ] || [ "$REQUEST_REF" != refs/heads/main ]; then
            echo "::error::Run this workflow on main in joshyorko/review."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - name: Install pinned changelog generator
        run: bash scripts/install-git-cliff.sh "$RUNNER_TEMP/git-cliff"
      - name: Validate version and create release pull request
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          current="$(bash scripts/review-appliance-version.sh)"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | [.tag_name, .draft, .prerelease] | @tsv' > "$RUNNER_TEMP/release-metadata"
          awk -F '\t' '{ print $1 }' "$RUNNER_TEMP/release-metadata" > "$RUNNER_TEMP/release-tags"
          awk -F '\t' '$2 == "false" && $3 == "false" { print $1 }' \
            "$RUNNER_TEMP/release-metadata" > "$RUNNER_TEMP/published-stable-release-tags"
          git tag --list >> "$RUNNER_TEMP/release-tags"
          REQUESTED_VERSION="$(python3 scripts/validate-release-version.py "$current" "${REQUESTED_VERSION:-${REQUESTED_BUMP:-patch}}" < "$RUNNER_TEMP/release-tags")"
          export PATH="$RUNNER_TEMP/git-cliff:$PATH"
          python3 scripts/review-changelog.py draft "$current" "$REQUESTED_VERSION" \
            "$RUNNER_TEMP/published-stable-release-tags" > "$RUNNER_TEMP/release-section"
          python3 scripts/review-changelog.py prepend "$REQUESTED_VERSION" < "$RUNNER_TEMP/release-section"
          branch="release/v$REQUESTED_VERSION"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "::error::Branch $branch already exists; inspect its pull request or remove the branch before retrying."
            exit 1
          fi
          git switch -c "$branch"
          printf '%s\n' "$REQUESTED_VERSION" > VERSION
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION CHANGELOG.md
          git commit -m "chore: release $REQUESTED_VERSION"
          git push origin "HEAD:refs/heads/$branch"
          printf 'Bump VERSION to %s. After merge, successful main validation triggers publication.\n\n' "$REQUESTED_VERSION" > "$RUNNER_TEMP/release-body"
          if ! grep -Fxq "v$current" "$RUNNER_TEMP/published-stable-release-tags"; then
            printf 'Supersedes unpublished v%s; these notes include changes since the last published stable release.\n\n' \
              "$current" >> "$RUNNER_TEMP/release-body"
          fi
          cat "$RUNNER_TEMP/release-section" >> "$RUNNER_TEMP/release-body"
          gh pr create --base main --head "$branch" --title "chore: release $REQUESTED_VERSION" \
            --body-file "$RUNNER_TEMP/release-body"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Dispatch exact pull-request validation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          set -euo pipefail
          expected_sha="$(gh pr view "$RELEASE_BRANCH" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          gh workflow run validate.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_BRANCH" -f "expected_sha=$expected_sha"
