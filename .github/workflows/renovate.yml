name: Renovate

# Renovate runs with a Mergeraptor GitHub App installation token, not the
# default GITHUB_TOKEN. Pushes and pull requests made with GITHUB_TOKEN do not
# trigger other workflows, so Renovate's PRs used to arrive with no checks at all
# while renovate.json asked for them to be auto-merged. With an app token the
# pull-request gate runs, and Renovate's own automerge merges once checks are green.
#
# Mergeraptor is an org-level app whose permissions are already granted across
# projectbluefin repositories (consuming MERGERAPTOR_APP_ID / MERGERAPTOR_PRIVATE_KEY).
#
# Daily polling follows stable OMP GitHub releases. The repository package rule
# runs one allowlisted pin synchronizer, then OMP-only automerge lets the main
# push trigger the native image publisher.

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log only; create or update nothing
        type: boolean
        default: false

concurrency:
  group: renovate
  cancel-in-progress: false

permissions: {}

jobs:
  renovate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get mergeraptor token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.MERGERAPTOR_APP_ID }}
          private-key: ${{ secrets.MERGERAPTOR_PRIVATE_KEY }}

      - uses: renovatebot/github-action@dcfba84a42d1b5d5e49bf131b1bf53511851a123 # v46.3.1
        with:
          configurationFile: renovate.json
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: ${{ inputs.dry_run == true && 'debug' || 'info' }}
          RENOVATE_DRY_RUN: ${{ inputs.dry_run == true && 'full' || '' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ALLOWED_COMMANDS: '["^node scripts/update-omp-pins\\.mjs$", "^node scripts/update-gh-pins\\.mjs$", "^node scripts/update-node-pins\\.mjs$", "^node scripts/update-tmux-pins\\.mjs$", "^node scripts/update-requirements-ci-hashes\\.mjs$"]'

      # Renovate reported success for a week while the shipped OMP fell five
      # releases behind: it resolved every release and pushed each onto
      # renovate/omp-runtime, but PR creation is rate-limited and that branch
      # never reached the front of the queue. Nothing failed, so nothing said
      # so. This step is what says so. A pin behind its upstream release is
      # normal for a few hours; a pin behind with NO branch carrying the fix
      # means the pipeline stopped delivering, and that is the failure.
      - name: Shipped pins are being delivered
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          containerfile=image/contribute/Containerfile
          pinned() { sed -nE "s/^ARG ${1}=(.*)$/\1/p" "$containerfile"; }
          stalled=0
          check() {
            local name="$1" arg="$2" latest="$3" branch="$4" current
            current="$(pinned "$arg")"
            [ "$current" = "$latest" ] && { echo "✓ ${name} ${current} is current"; return 0; }
            # The checkout keeps no credentials, so ask the API rather than the
            # git remote whether Renovate has the update in flight.
            if gh api "repos/${GITHUB_REPOSITORY}/branches/${branch}" --silent >/dev/null 2>&1; then
              echo "… ${name} ${current} -> ${latest} in flight on ${branch}"
              return 0
            fi
            echo "✗ ${name} ${current} is behind ${latest} and no ${branch} carries the update" >&2
            stalled=1
          }
          release() { gh api "repos/$1/releases/latest" --jq .tag_name | sed 's/^v//'; }
          check OMP OMP_VERSION "$(release can1357/oh-my-pi)" renovate/omp-runtime
          check "GitHub CLI" GH_VERSION "$(release cli/cli)" renovate/github-cli-runtime
          check tmux TMUX_VERSION "$(release tmux/tmux-builds)" renovate/tmux-runtime
          # Within the pinned major on purpose: a new major going LTS is a
          # deliberate decision, not a delivery failure, and must not turn this
          # guard red every day until someone takes it.
          node_major="$(pinned NODE_VERSION | cut -d. -f1)"
          check Node NODE_VERSION \
            "$(curl -fsS --max-time 30 https://nodejs.org/dist/index.json |
                jq -r --arg m "v${node_major}." '[.[] | select(.version | startswith($m))][0].version' | sed 's/^v//')" \
            renovate/node.js-runtime
          if [ "$stalled" -ne 0 ]; then
            echo "::error::a shipped runtime pin is behind upstream with no Renovate branch delivering it" >&2
            exit 1
          fi
