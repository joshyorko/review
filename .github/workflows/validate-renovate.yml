name: Validate Renovate Config
on:
  pull_request:
    paths: [renovate.json]
  push:
    branches: [main]
    paths: [renovate.json]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.x'
      - run: npx --yes --package renovate@44.181.2 renovate-config-validator --strict renovate.json
