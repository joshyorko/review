name: Review release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Committed source ref to package
        required: false
        type: string
        default: main
      publish:
        description: Publish the verified stable release
        type: boolean
        default: false

concurrency:
  group: review-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'joshyorko/review'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref || 'main' }}
          fetch-depth: 0
      - name: Resolve release version
        id: version
        run: echo "version=$(bash scripts/review-appliance-version.sh)" >> "$GITHUB_OUTPUT"
      - name: Test the packaging contracts
        run: python3 tests/package_review_contract.py
      - name: Install Apptainer
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update -qq
          sudo apt-get install -y apptainer
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          authfile="$RUNNER_TEMP/ghcr-auth.json"
          printf '%s' "$GITHUB_TOKEN" |
            podman login ghcr.io --username "$GITHUB_ACTOR" --authfile "$authfile" --password-stdin
          chmod 0600 "$authfile"
      - name: Build committed launcher and matching native SIF
        env:
          SOURCE_REF: ${{ inputs.source_ref || 'main' }}
          REVIEW_SOURCE_REF: ${{ inputs.source_ref || 'main' }}
          REVIEW_OCI_PUSH: "1"
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/ghcr-auth.json
        # scripts/package-review performs the authenticated podman push before it builds the SIF.
        run: ./scripts/package-review build "$SOURCE_REF" "$RUNNER_TEMP/bundles"
      - name: Check out tools tap packaging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: joshyorko/homebrew-tools
          path: tools-tap
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-candidate-${{ matrix.arch }}
          path: ${{ runner.temp }}/bundles/*
          if-no-files-found: error
      - name: Run candidate SIF on the native host
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidate"
          tar -xzf "$RUNNER_TEMP/bundles/review-${{ matrix.arch }}.tar.gz" -C "$RUNNER_TEMP/candidate"
          bash tools-tap/scripts/smoke-review-sif.sh "$RUNNER_TEMP/candidate/launcher/review.sif"
      - name: Install and test candidate through Homebrew
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: '0.21.11'
          module: ./tools-tap/dagger/tap-pipeline
          call: >-
            review-candidate-check
            --artifact=${{ runner.temp }}/bundles/review-${{ matrix.arch }}.tar.gz
            --version=${{ steps.version.outputs.version }}


  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: review-candidate-*
          path: ${{ runner.temp }}/bundles
          merge-multiple: true
      - name: Publish the matching OCI index
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          authfile="$RUNNER_TEMP/ghcr-auth.json"
          printf '%s' "$GITHUB_TOKEN" |
            podman login ghcr.io --username "$GITHUB_ACTOR" --authfile "$authfile" --password-stdin
          chmod 0600 "$authfile"
          mapfile -t manifests < <(printf '%s\n' "$RUNNER_TEMP"/bundles/manifest-*.json | sort)
          test "${#manifests[@]}" -gt 0
          sha="$(jq -r '.sha' "${manifests[0]}")"
          image="$(jq -r '.oci_image' "${manifests[0]}")"
          test "$image" = "ghcr.io/joshyorko/review:sha-$sha"
          podman manifest create "$image"
          for record in "${manifests[@]}"; do
            test "$(jq -r '.sha' "$record")" = "$sha"
            arch_image="$(jq -r '.oci_arch_image' "$record")"
            arch="$(jq -r '.arch' "$record")"
            test "$arch_image" = "$image-$arch"
            arch_repository="${arch_image%%:*}"
            test "$arch_repository" = "ghcr.io/joshyorko/review"
            digest="$(jq -r '.oci_arch_digest' "$record")"
            test "$digest" != null
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            podman manifest add "$image" "$arch_repository@$digest"
          done
          podman manifest push --all --format oci --authfile "$authfile" \
            --digestfile "$RUNNER_TEMP/oci-index-digest" "$image" "docker://$image"
          grep -Eq '^sha256:[0-9a-f]{64}$' "$RUNNER_TEMP/oci-index-digest"
          version="$(bash scripts/review-appliance-version.sh)"
          podman manifest push --all --format oci --authfile "$authfile" "$image" "docker://ghcr.io/joshyorko/review:v$version"
          podman manifest push --all --format oci --authfile "$authfile" "$image" "docker://ghcr.io/joshyorko/review:stable"
          echo "Published $image @ $(cat "$RUNNER_TEMP/oci-index-digest")"
      - name: Validate native bundles and generate formula
        run: python3 scripts/review-formula.py "$RUNNER_TEMP/bundles" "$RUNNER_TEMP/formula"
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(cat "$RUNNER_TEMP/formula/sha")"
          tag="$(cat "$RUNNER_TEMP/formula/tag")"
          gh release create "$tag" --target "$sha" --title "Review ${tag#v}" \
            --notes-file "$RUNNER_TEMP/formula/notes" \
            "$RUNNER_TEMP"/bundles/review-*.tar.gz "$RUNNER_TEMP"/bundles/manifest-*.json \
            "$RUNNER_TEMP/formula/review.rb"
