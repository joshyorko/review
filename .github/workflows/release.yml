name: Review release

on:
  workflow_run:
    workflows: [validate]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Committed source ref to package
        required: false
        type: string
        default: main
      publish:
        description: Publish the verified stable release
        type: boolean
        default: false

concurrency:
  group: review-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: >-
      github.repository == 'joshyorko/review' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      build: ${{ steps.source.outputs.build }}
      publish: ${{ steps.source.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.source_ref || github.sha }}
          fetch-depth: 0
      - name: Resolve immutable source and skip published versions
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMATIC: ${{ github.event_name == 'workflow_run' }}
          PUBLISH: ${{ github.event_name == 'workflow_run' || inputs.publish }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"
          test -z "$(git status --porcelain=v1)" || {
            echo "::error::release source checkout is dirty"
            exit 1
          }
          if [ "$AUTOMATIC" = false ] && [ "$PUBLISH" = true ]; then
            [[ "$GITHUB_REF" == refs/heads/main ]] || {
              echo "::error::publication workflow must run from main"
              exit 1
            }
            [[ "$sha" == "$main_sha" ]] || {
              echo "::error::publication source must be the exact current main commit"
              exit 1
            }
            # The source checkout is now pinned to trusted main before this helper runs.
            bash scripts/validate-release-source.sh "$sha" "$main_sha" "$PUBLISH"
          fi
          version="$(bash scripts/review-appliance-version.sh)"
          {
            echo "sha=$sha"
            echo "version=$version"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"
          # API errors must fail, never masquerade as an unpublished version.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags"
          if [ "$PUBLISH" = true ] && grep -Fxq "v$version" "$RUNNER_TEMP/release-tags"; then
            if [ "$AUTOMATIC" = false ]; then
              echo "::error::Review $version is already published; run Request Review release with a new version."
              exit 1
            fi
            echo "Review $version is already published; bump VERSION to publish new code."
            echo "build=false" >> "$GITHUB_OUTPUT"
          elif [ "$AUTOMATIC" = true ] && [ "$sha" != "$(git rev-parse origin/main)" ]; then
            echo "A newer main commit superseded this run."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/review-changelog.py section "$version" > /dev/null
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: Resolve release version
        id: version
        run: echo "version=$(bash scripts/review-appliance-version.sh)" >> "$GITHUB_OUTPUT"
      - name: Test the packaging contracts
        run: python3 tests/package_review_contract.py
      - name: Install Apptainer
        run: bash scripts/install-apptainer-ci.sh
      - name: Check out tools tap SIF smoke
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: joshyorko/homebrew-tools
          path: tools-tap
      - name: Create committed source snapshot for Dagger
        run: python3 scripts/ci/source-snapshot.py "$RUNNER_TEMP/review-source" --history
      - name: Build the exact-source OCI artifact with Dagger
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: '0.21.11'
          verb: call
          args: >-
            appliance-archive
            --source=${{ runner.temp }}/review-source
            --revision=${{ needs.prepare.outputs.sha }}
            -o=${{ runner.temp }}/review.oci.tar
      - name: Build committed launcher and matching native SIF
        env:
          SOURCE_REF: ${{ needs.prepare.outputs.sha }}
          REVIEW_SOURCE_REF: ${{ needs.prepare.outputs.sha }}
          REVIEW_OCI_INPUT: ${{ runner.temp }}/review.oci.tar
          REVIEW_OCI_ARCHIVE: ${{ runner.temp }}/bundles/review-${{ matrix.arch }}.oci.tar
        # Candidate construction is local and credential-free; the publish job owns registry writes.
        run: ./scripts/package-review build "$SOURCE_REF" "$RUNNER_TEMP/bundles"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-candidate-${{ matrix.arch }}
          path: ${{ runner.temp }}/bundles/*
          if-no-files-found: error
      - name: Run candidate SIF on the native host
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidate"
          tar -xzf "$RUNNER_TEMP/bundles/review-${{ matrix.arch }}.tar.gz" -C "$RUNNER_TEMP/candidate"
          bash tools-tap/scripts/smoke-review-sif.sh "$RUNNER_TEMP/candidate/launcher/review.sif"
      - name: Install and test candidate through Homebrew
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: '0.21.11'
          module: ./tools-tap/dagger/tap-pipeline
          call: >-
            review-candidate-check
            --artifact=${{ runner.temp }}/bundles/review-${{ matrix.arch }}.tar.gz
            --version=${{ needs.prepare.outputs.version }}
  publish:
    if: needs.prepare.outputs.publish == 'true' && github.ref == 'refs/heads/main'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: review-candidate-*
          path: ${{ runner.temp }}/bundles
          merge-multiple: true
      - name: Log in to GHCR and publish immutable architecture images
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          authfile="$RUNNER_TEMP/ghcr-auth.json"
          printf '%s' "$GITHUB_TOKEN" |
            podman login ghcr.io --username "$GITHUB_ACTOR" --authfile "$authfile" --password-stdin
          chmod 0600 "$authfile"
          mapfile -t manifests < <(printf '%s\n' "$RUNNER_TEMP"/bundles/manifest-*.json | sort)
          test "${#manifests[@]}" -eq 2
          for record in "${manifests[@]}"; do
            sha="$(jq -r '.sha' "$record")"
            arch="$(jq -r '.arch' "$record")"
            image="$(jq -r '.oci_arch_image' "$record")"
            archive="$RUNNER_TEMP/bundles/review-$arch.oci.tar"
            test -s "$archive"
            test "$image" = "ghcr.io/joshyorko/review:sha-$sha-$arch"
            archive_identity="$(skopeo inspect --format '{{.Digest}} {{index .Labels "org.opencontainers.image.revision"}}' "oci-archive:$archive")"
            read -r archive_digest revision <<<"$archive_identity"
            test "$revision" = "$sha"
            [[ "$archive_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            skopeo copy --all --preserve-digests --dest-authfile "$authfile" \
              "oci-archive:$archive" "docker://$image"
            registry_digest="$(skopeo inspect --authfile "$authfile" --format '{{.Digest}}' "docker://$image")"
            bash scripts/ci/check-oci-digest.sh "$archive_digest" "$registry_digest"
            python3 - "$record" "$archive_digest" "$registry_digest" <<'PY'
          import json,sys
          from pathlib import Path
          path=Path(sys.argv[1]); record=json.loads(path.read_text())
          record['oci_archive_digest']=sys.argv[2]
          record['oci_arch_digest']=sys.argv[3]
          path.write_text(json.dumps(record,indent=2)+'\n')
          PY
          done
      - name: Validate native bundles and generate formula
        run: python3 scripts/review-formula.py "$RUNNER_TEMP/bundles" "$RUNNER_TEMP/formula"
      - name: Publish the matching OCI index
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          authfile="$RUNNER_TEMP/ghcr-auth.json"
          mapfile -t manifests < <(printf '%s\n' "$RUNNER_TEMP"/bundles/manifest-*.json | sort)
          test "${#manifests[@]}" -eq 2
          sha="$(jq -r '.sha' "${manifests[0]}")"
          image="$(jq -r '.oci_image' "${manifests[0]}")"
          test "$image" = "ghcr.io/joshyorko/review:sha-$sha"
          podman manifest create "$image"
          for record in "${manifests[@]}"; do
            test "$(jq -r '.sha' "$record")" = "$sha"
            arch_image="$(jq -r '.oci_arch_image' "$record")"
            arch="$(jq -r '.arch' "$record")"
            test "$arch_image" = "$image-$arch"
            arch_repository="${arch_image%%:*}"
            test "$arch_repository" = "ghcr.io/joshyorko/review"
            digest="$(jq -r '.oci_arch_digest' "$record")"
            test "$digest" != null
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            podman manifest add "$image" "$arch_repository@$digest"
          done
          podman manifest push --all --format oci --authfile "$authfile" \
            --digestfile "$RUNNER_TEMP/oci-index-digest" "$image" "docker://$image"
          grep -Eq '^sha256:[0-9a-f]{64}$' "$RUNNER_TEMP/oci-index-digest"
          version="$(bash scripts/review-appliance-version.sh)"
          podman manifest push --all --format oci --authfile "$authfile" "$image" "docker://ghcr.io/joshyorko/review:v$version"
          podman manifest push --all --format oci --authfile "$authfile" "$image" "docker://ghcr.io/joshyorko/review:stable"
          echo "Published $image @ $(cat "$RUNNER_TEMP/oci-index-digest")"
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(cat "$RUNNER_TEMP/formula/sha")"
          tag="$(cat "$RUNNER_TEMP/formula/tag")"
          gh release create "$tag" --target "$sha" --title "Review ${tag#v}" \
            --notes-file "$RUNNER_TEMP/formula/notes" \
            "$RUNNER_TEMP"/bundles/review-*.tar.gz "$RUNNER_TEMP"/bundles/manifest-*.json \
            "$RUNNER_TEMP/formula/review.rb"
