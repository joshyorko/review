name: validate

# justfile is the shipped launcher. This workflow validates its shell,
# the Review appliance contract, and hermetic launcher behavior without live
# services or an interactive terminal.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact generated pull-request head to validate
        required: true
        type: string
permissions:
  attestations: read
  contents: read
  pull-requests: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Create a source-only Dagger input
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/review-ci-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/review-ci-source"
      - name: Verify the local-first Dagger contract profile
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: '0.21.11'
          verb: call
          args: contract --source=${{ runner.temp }}/review-ci-source
      - name: Verify explicitly dispatched release pull request
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EVENT_REF: ${{ github.ref_name }}
        run: bash scripts/validate-release-dispatch.sh

      - name: Explicit release dispatch guard contract
        run: python3 tests/release-dispatch-guard.py

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.x'

      - name: Set up Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.x'

      # pre-commit/action is maintenance-only upstream, so run pre-commit
      # directly instead.
      - name: Static hygiene
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements-ci.lock
          SKIP=check-skill-frontmatter,generate-skills,omp-review-mode,appliance-contract pre-commit run --all-files --show-diff-on-failure

      - name: Commit message CI-skip guard contract
        run: |
          set -euo pipefail
          bash tests/check-commit-message.sh

      - name: Skill frontmatter valid and generated index fresh
        run: |
          set -euo pipefail
          bash scripts/check-skill-frontmatter.sh
      - name: Skill generator rejects unsafe manifest paths
        run: |
          set -euo pipefail
          bash tests/generate-skills.sh

      - name: Review package contract
        run: |
          set -euo pipefail
          python3 tests/package_review_contract.py
          python3 tests/release_version_test.py
          bash scripts/install-git-cliff.sh "$RUNNER_TEMP/git-cliff"
          PATH="$RUNNER_TEMP/git-cliff:$PATH" python3 tests/review_changelog_test.py

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Justfile parses
        run: |
          set -euo pipefail
          just --justfile justfile --list

      - name: Guided onboarding behavior
        run: |
          set -euo pipefail
          bash tests/just-onboarding.sh

      - name: Recipe bodies are valid bash
        run: |
          set -euo pipefail
          # Recipe headers in this file look like 'review:',
          # 'review-doctor:' — a bare identifier + colon at column 0,
          # no parameters. Grab every indented line following one, until the
          # next non-indented, non-comment, non-blank line.
          awk '
            /^[a-zA-Z][a-zA-Z0-9_-]*:$/ { flag=1; next }
            /^[^ \t#]/ { flag=0 }
            flag { print }
          ' justfile > recipe_bodies.sh
          bash -n recipe_bodies.sh
          rm -f recipe_bodies.sh

      - name: Test registry is complete
        run: |
          set -euo pipefail
          bash tests/test-registry.sh

      - name: Launcher post-exit diagnostics and signal delivery
        run: |
          set -euo pipefail
          python3 tests/launcher_diagnostic_collector.py

      # The omp review mode and the appliance it ships in. The mode is the only
      # TypeScript here and executes only inside a TUI, so it is driven
      # headlessly against a fake host; the appliance's static contract holds
      # its pins and its version derivation without needing a container engine.
      - name: Review mode and pin updater contracts
        timeout-minutes: 10
        run: |
          set -euo pipefail
          node --test tests/update-omp-pins.test.mjs
          node --test tests/qualify-omp-upgrade.test.mjs
          node --test tests/update-derived-pins.test.mjs
          bash tests/omp-review-mode.sh
          node --test tests/luna_factory.test.ts
          node --test --disable-warning=MODULE_TYPELESS_PACKAGE_JSON tests/luna_factory_dogfood_contract.test.ts
          bash tests/appliance-runtime-probe.sh "$RUNNER_TEMP/luna-factory-capabilities" "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Pinned OMP SDK type compatibility
        run: |
          set -euo pipefail
          sdk_version="$(sed -n 's/^ARG OMP_VERSION=//p' image/appliance/Containerfile)"
          sdk_root="$RUNNER_TEMP/factory-sdk-types"
          npm install --prefix "$sdk_root" --ignore-scripts --no-audit --no-fund typescript@5.9.3 @types/node@24 "@oh-my-pi/pi-coding-agent@$sdk_version"
          OMP_SDK_NODE_MODULES="$sdk_root/node_modules" bash tests/luna-factory-sdk-types.sh

      - name: Pinned OMP source regressions
        # Run candidate-pin behavior checks before the strict provenance contract.
        run: |
          set -euo pipefail
          omp_version="$(sed -n 's/^ARG OMP_VERSION=//p' image/appliance/Containerfile)"
          test -n "$omp_version"
          git clone --depth 1 --branch "v${omp_version}" https://github.com/can1357/oh-my-pi.git "$RUNNER_TEMP/review-omp-source"
          if [[ "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}" == patchraptor/omp-runtime ]]; then
            REVIEW_OMP_PATCH_QUALIFICATION=1 REVIEW_OMP_SOURCE="$RUNNER_TEMP/review-omp-source" node --test tests/fixtures/issue-140-clipboard-truth.test.mjs
          else
            REVIEW_OMP_SOURCE="$RUNNER_TEMP/review-omp-source" node --test tests/fixtures/issue-140-clipboard-truth.test.mjs
          fi
          REVIEW_OMP_SOURCE="$RUNNER_TEMP/review-omp-source" npx --yes tsx@4.21.0 --test --test-name-pattern='packaged OMP current pin delivers and evicts' tests/omp-review-mode.test.ts

      - name: Requalify OMP compatibility patches
        if: github.head_ref == 'patchraptor/omp-runtime' || github.ref_name == 'patchraptor/omp-runtime'
        timeout-minutes: 30
        run: node scripts/qualify-omp-upgrade.mjs --if-stale

      - name: Appliance pin contract
        run: |
          set -euo pipefail
          bash tests/appliance-contract.sh
          bash tests/version-derivation.sh

      - name: Packaged runtime capability report
        run: |
          set -euo pipefail
          tests/appliance-runtime-probe.sh "$RUNNER_TEMP/luna-factory-capabilities" "${{ github.event.pull_request.head.sha || github.sha }}"


      - name: Interactive launcher docs and shell stay aligned
        run: |
          set -euo pipefail
          bash tests/readme-quickstart.sh
          grep -Fq 'review-appliance' justfile
          grep -Fq 'review-queue' justfile
          grep -Fq 'brew install joshyorko/tools/review' README.md

      - name: Build and execute Review appliance
        run: |
          set -euo pipefail
          review_version="$(bash scripts/review-appliance-version.sh)"
          podman build --format oci \
            --build-arg REVIEW_VERSION="$review_version" \
            --build-arg REVIEW_REVISION="$GITHUB_SHA" \
            -f image/appliance/Containerfile -t review:test .

          REVIEW_APPLIANCE_IMAGE=review:test bash tests/review-factory-coload-smoke.sh

  apptainer-ubuntu26-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Apptainer through the upstream architecture index
        run: |
          set -euo pipefail
          bash scripts/install-apptainer-ci.sh
      - name: Verify upstream package profile and SIF execution
        run: |
          set -euo pipefail
          cat /etc/os-release
          printf '\nApptainer package: '
          dpkg-query -W -f='${Version}\n' apptainer
          printf '\nInstalled starter:\n'
          dpkg-query -L apptainer | grep -E '/apptainer/bin/starter(-suid)?$'
          printf '\nAppArmor profile:\n'
          sudo cat /etc/apparmor.d/apptainer
          printf '\nSIF execution probe:\n'
          apptainer exec docker://ghcr.io/apptainer/lolcow /usr/bin/true \
            >"$RUNNER_TEMP/apptainer-probe.log" 2>&1 || {
              result=$?
              cat "$RUNNER_TEMP/apptainer-probe.log"
              exit "$result"
            }
          cat "$RUNNER_TEMP/apptainer-probe.log"
