name: validate

# justfile is the shipped launcher. This workflow validates its shell,
# the Review appliance contract, and hermetic launcher behavior without live
# services or an interactive terminal.

on:
  push:
  pull_request:

permissions:
  attestations: read
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.x'

      # pre-commit/action is maintenance-only upstream, so run pre-commit
      # directly instead.
      - name: Static hygiene
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements-ci.lock
          SKIP=check-skill-frontmatter,generate-skills,omp-review-mode,appliance-contract pre-commit run --all-files --show-diff-on-failure

      - name: Commit message CI-skip guard contract
        run: |
          set -euo pipefail
          bash tests/check-commit-message.sh

      - name: Skill frontmatter valid and generated index fresh
        run: |
          set -euo pipefail
          bash scripts/check-skill-frontmatter.sh
      - name: Skill generator rejects unsafe manifest paths
        run: |
          set -euo pipefail
          bash tests/generate-skills.sh

      - name: Personal Brew package contract
        run: |
          set -euo pipefail
          python3 tests/brew_dev_contract.py

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Justfile parses
        run: |
          set -euo pipefail
          just --justfile justfile --list

      - name: Guided onboarding behavior
        run: |
          set -euo pipefail
          bash tests/just-onboarding.sh

      - name: Recipe bodies are valid bash
        run: |
          set -euo pipefail
          # Recipe headers in this file look like 'review:',
          # 'review-doctor:' — a bare identifier + colon at column 0,
          # no parameters. Grab every indented line following one, until the
          # next non-indented, non-comment, non-blank line.
          awk '
            /^[a-zA-Z][a-zA-Z0-9_-]*:$/ { flag=1; next }
            /^[^ \t#]/ { flag=0 }
            flag { print }
          ' justfile > recipe_bodies.sh
          bash -n recipe_bodies.sh
          rm -f recipe_bodies.sh

      - name: Test registry is complete
        run: |
          set -euo pipefail
          bash tests/test-registry.sh

      # The omp review mode and the appliance it ships in. The mode is the only
      # TypeScript here and executes only inside a TUI, so it is driven
      # headlessly against a fake host; the appliance's static contract holds
      # its pins and its version derivation without needing a container engine.
      - name: Review mode and appliance contracts
        timeout-minutes: 10
        run: |
          set -euo pipefail
          node --test tests/update-omp-pins.test.mjs
          node --test tests/update-derived-pins.test.mjs
          bash tests/omp-review-mode.sh
          node --test tests/luna_factory.test.ts
          node --test --disable-warning=MODULE_TYPELESS_PACKAGE_JSON tests/luna_factory_dogfood_contract.test.ts
          bash tests/appliance-runtime-probe.sh "$RUNNER_TEMP/luna-factory-capabilities" "${{ github.event.pull_request.head.sha || github.sha }}"
          bash tests/appliance-contract.sh

          bash tests/version-derivation.sh
      - name: Packaged OMP async-result consumption regression
        # Exercise consumed-result eviction with the exact packaged OMP manager.
        # The normal Review suite remains hermetic.
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v18.3.0 https://github.com/can1357/oh-my-pi.git "$RUNNER_TEMP/review-omp-source"
          REVIEW_OMP_SOURCE="$RUNNER_TEMP/review-omp-source" node --experimental-transform-types --test --test-name-pattern='packaged OMP 18.3.0' tests/omp-review-mode.test.ts

      - name: Packaged runtime capability report
        run: |
          set -euo pipefail
          tests/appliance-runtime-probe.sh "$RUNNER_TEMP/luna-factory-capabilities" "${{ github.event.pull_request.head.sha || github.sha }}"


      - name: Interactive launcher docs and shell stay aligned
        run: |
          set -euo pipefail
          bash tests/readme-quickstart.sh
          grep -Fq 'review-appliance' justfile
          grep -Fq 'review-queue' justfile
          grep -Fq 'github.com/joshyorko/review' README.md

      - name: Build and execute Review appliance
        run: |
          set -euo pipefail
          review_version="$(bash scripts/review-appliance-version.sh)"
          podman build --format oci \
            --build-arg REVIEW_VERSION="$review_version" \
            --build-arg REVIEW_REVISION="$GITHUB_SHA" \
            -f image/appliance/Containerfile -t review:test .

          REVIEW_APPLIANCE_IMAGE=review:test bash tests/review-factory-coload-smoke.sh

      # Interactive launchers prefer KVM and fall back to Apptainer. CI builds
      # and executes the Review appliance natively; both launcher branches are
      # exercised hermetically.
