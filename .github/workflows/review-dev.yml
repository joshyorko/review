name: personal Review Brew package

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      source_ref:
        description: Existing Git ref or SHA to package; blank uses this workflow commit
        required: false
        type: string

concurrency:
  group: personal-review-brew
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'joshyorko/review'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Test the packaging contracts
        run: python3 tests/brew_dev_contract.py
      - name: Install Apptainer
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update -qq
          sudo apt-get install -y apptainer
      - name: Build committed launcher and matching native SIF
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          BLUEFIN_REVIEW_SOURCE_REF: ${{ inputs.source_ref || github.ref_name }}
        run: ./scripts/brew-dev build "${SOURCE_REF:-$GITHUB_SHA}" "$RUNNER_TEMP/bundles"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-dev-${{ matrix.arch }}
          path: ${{ runner.temp }}/bundles/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: review-dev-*
          path: ${{ runner.temp }}/bundles
          merge-multiple: true
      - name: Publish immutable assets and update only the personal tap
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_KEY: ${{ secrets.REVIEW_DEV_TAP_SSH_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/review-dev-tap-key"
          hosts="$RUNNER_TEMP/review-dev-known-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          umask 077
          printf '%s\n' "$TAP_KEY" > "$key"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$hosts"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o UserKnownHostsFile=$hosts"
          ./scripts/brew-dev publish "$RUNNER_TEMP/bundles"
