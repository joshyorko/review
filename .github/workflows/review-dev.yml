name: personal Review Brew package

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Existing Git ref or SHA in this fork to package
        required: false
        type: string
        default: self-hosted

concurrency:
  group: personal-review-brew
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'joshyorko/review'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref || 'self-hosted' }}
          fetch-depth: 0
      - name: Test the packaging contracts
        run: python3 tests/brew_dev_contract.py
      - name: Install Apptainer
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update -qq
          sudo apt-get install -y apptainer
      - name: Log in to the personal GHCR namespace
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          authfile="$RUNNER_TEMP/ghcr-auth.json"
          printf '%s' "$GITHUB_TOKEN" |
            podman login ghcr.io --username "$GITHUB_ACTOR" --authfile "$authfile" --password-stdin
          chmod 0600 "$authfile"
      - name: Build committed launcher and matching native SIF
        env:
          SOURCE_REF: ${{ inputs.source_ref || 'self-hosted' }}
          BLUEFIN_REVIEW_SOURCE_REF: ${{ inputs.source_ref || 'self-hosted' }}
          BLUEFIN_REVIEW_OCI_PUSH: "1"
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/ghcr-auth.json
        # scripts/brew-dev performs the authenticated podman push before it builds the SIF.
        run: ./scripts/brew-dev build "$SOURCE_REF" "$RUNNER_TEMP/bundles"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-dev-${{ matrix.arch }}
          path: ${{ runner.temp }}/bundles/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: self-hosted
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: review-dev-*
          path: ${{ runner.temp }}/bundles
          merge-multiple: true
      - name: Publish the matching personal OCI index
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          authfile="$RUNNER_TEMP/ghcr-auth.json"
          printf '%s' "$GITHUB_TOKEN" |
            podman login ghcr.io --username "$GITHUB_ACTOR" --authfile "$authfile" --password-stdin
          chmod 0600 "$authfile"
          mapfile -t manifests < <(printf '%s\n' "$RUNNER_TEMP"/bundles/manifest-*.json | sort)
          test "${#manifests[@]}" -gt 0
          sha="$(jq -r '.sha' "${manifests[0]}")"
          image="$(jq -r '.oci_image' "${manifests[0]}")"
          test "$image" = "ghcr.io/joshyorko/review-appliance:sha-$sha"
          podman manifest create "$image"
          for record in "${manifests[@]}"; do
            test "$(jq -r '.sha' "$record")" = "$sha"
            arch_image="$(jq -r '.oci_arch_image' "$record")"
            arch="$(jq -r '.arch' "$record")"
            test "$arch_image" = "$image-$arch"
            arch_repository="${arch_image%%:*}"
            test "$arch_repository" = "ghcr.io/joshyorko/review-appliance"
            digest="$(jq -r '.oci_arch_digest' "$record")"
            test "$digest" != null
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            podman manifest add "$image" "$arch_repository@$digest"
          done
          podman manifest push --all --format oci --authfile "$authfile" \
            --digestfile "$RUNNER_TEMP/oci-index-digest" "$image" "docker://$image"
          grep -Eq '^sha256:[0-9a-f]{64}$' "$RUNNER_TEMP/oci-index-digest"
          echo "Published $image @ $(cat "$RUNNER_TEMP/oci-index-digest")"
      - name: Publish immutable assets and update only the personal tap
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_KEY: ${{ secrets.REVIEW_DEV_TAP_SSH_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/review-dev-tap-key"
          hosts="$RUNNER_TEMP/review-dev-known-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          umask 077
          printf '%s\n' "$TAP_KEY" > "$key"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$hosts"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o UserKnownHostsFile=$hosts"
          ./scripts/brew-dev publish "$RUNNER_TEMP/bundles"
