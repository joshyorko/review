# Validate the title using the trusted default-branch Dagger module. The event
# title is data only; this workflow never checks out or executes pull request code.
name: pr-title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate PR title
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        with:
          version: '0.21.11'
          verb: call
          args: pr-title --title "$PR_TITLE"
