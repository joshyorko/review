# Invocation overlay owned by the immutable contributor image. Hive owns the
# `omp` command line inside the tmux session, so this reaches OMP through
# PI_CONFIG_FILES rather than `--config`; it loads above user and project
# settings and below Hive's own runtime flags.
#
# A packaged binary never advertises an in-place update: `omp update` cannot
# write to a read-only image, and the banner is pure noise on an attended
# terminal whose whole purpose is the agent below it.
startup:
  checkUpdate: false
  # A contributor starts on a fresh state volume, and Hive drives the session
  # unattended inside tmux. The onboarding wizard would sit on the pane
  # waiting for an answer nobody is there to give.
  setupWizard: false

# The attended terminal ships a Nerd Font. Left at the `unicode` default OMP
# draws the fallback glyph set and then asks the operator to "use nerdfont" on
# every launch, which is neither actionable inside a distroless image nor true
# of the terminal it is running in.
symbolPreset: nerd

# A contributor session is unattended: Hive injects the prompt and nobody is
# watching the pane. A second reader that can raise a blocker before the agent
# opens a pull request is worth its cost in exactly that situation.
#
# No model is named here, and that is the point: the advisor resolves through
# `modelRoles.advisor` on the machine running the image, so the contributor's
# own OMP configuration decides which model reviews their work — and what it
# costs them. Naming one here would spend a stranger's quota by default.
# Unresolvable simply reports `no_model` and the session runs unadvised.
advisor:
  enabled: true
  # Bounded catch-up, capped at 30s: the primary waits only while the advisor
  # is a full update behind. Without it the agent can finish and push before
  # its reviewer has seen the middle of the work.
  syncBacklog: 1
