# Invocation overlay owned by the immutable appliance. User and project
# settings still apply, except that a packaged binary never advertises an
# in-place update that cannot survive appliance replacement.
startup:
  checkUpdate: false

modelRoles:
  advisor: "@default"
advisor:
  syncBacklog: 1


eval:
  workpool:
    freshAgents: true

task:
  maxConcurrency: 4
  maxRecursionDepth: 1
  maxRuntimeMs: 3600000
  softRequestBudget: 90
  agentIdleTtlMs: 300000
  isolation:
    # The appliance starts from an empty /workspace. Each write-capable worker
    # clones one unique checkout under $HOME/worktrees instead of asking OMP to
    # derive an isolation from a parent checkout that does not exist.
    enabled: false
    apply: false

read:
  defaultLimit: 200

tools:
  intentTracing: false
  outputMaxColumns: 240

textVerbosity: low
